name: validate

on:
  push:
  pull_request:

jobs:
  records:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - name: Validate records
        # Fails on any schema error, any dangling `sources` entry, any
        # ambiguous id, and any DANGLING CROSS-REFERENCE above the ceiling
        # recorded in tools/ref_budget.json, and any unresolvable docs/
        # citation above tools/docs_ref_budget.json. Both budgets are ratchets:
        # the committed debt is printed on every run and one more fails here.
        # Lower the ceiling in the same PR that fixes a reference.
        run: python tools/validate.py
      - name: Tool self-tests
        run: python tools/test_tools.py
      - name: Generate index
        # docs/00-index.md is generated and gitignored. It used to be committed,
        # which made every data-touching branch conflict on it. CI regenerates
        # it so the catalogue is always current without being a merge hotspot.
        run: python tools/index.py
      - name: Rank local models
        # docs/29-local-model-ranking.md is generated from data/models and
        # gitignored, same reasoning as the index. The ranking is a pure
        # function of the records, so it is regenerated rather than maintained.
        run: python tools/rank_models.py > docs/29-local-model-ranking.md

      - name: Intelligence density
        run: python tools/intelligence_density.py

      - name: Agentic ranking
        run: python tools/agentic_ranking.py
      - name: Report coverage
        run: |
          python tools/query.py stats
          python tools/query.py gaps